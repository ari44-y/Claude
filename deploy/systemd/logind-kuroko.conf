# ノートパソコンのふたを閉じてもスリープしないようにする（要件定義書 5.3）。
# /etc/systemd/logind.conf.d/ に置く。
# 本体の /etc/systemd/logind.conf を直接書き換えず、追加の設定ファイルとして置くと、
# Ubuntu の更新で logind.conf が新しくなっても設定が消えない。

[Login]
# 電源につないでいないとき
HandleLidSwitch=ignore
# 電源につないでいるとき
HandleLidSwitchExternalPower=ignore
# 外部ディスプレイなどにつないでいるとき
HandleLidSwitchDocked=ignore
