[project]
name = "kuroko-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.10,<4",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "python-dateutil>=4.0.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend フォルダを import の起点にする（"from app.xxx import ..." が通るように）
pythonpath = ["."]

[tool.ruff]
line-length = 100
# 自動生成されたマイグレーションは対象外
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: 基本的な誤り、I: import の並び順、UP: 新しい書き方、B: バグになりやすい書き方
select = ["E", "F", "I", "UP", "B"]
# 行の長さはフォーマッター（ruff format）に任せる。日本語のコメントは幅2で数えられ、すぐ超えるため
ignore = ["E501"]

[tool.ruff.lint.isort]
# backend/alembic フォルダがあるため、ライブラリの alembic を自分のコードと勘違いしないようにする
known-third-party = ["alembic"]
